spring:
  application:
    name: fieldsync-spring-api

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 120MB

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never