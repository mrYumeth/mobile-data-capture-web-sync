spring:

  config:
    import: "configtree:${FIELDSYNC_OPENBAO_CONFIGTREE}"

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/fieldsync}

server:
  port: 8081

fieldsync:

  openbao:
    verification-file: ${FIELDSYNC_OPENBAO_VERIFICATION_FILE:../dev-environment/openbao/rendered/verification.txt}

  storage:

    local:
      directory: ${FIELDSYNC_LOCAL_IMAGE_DIRECTORY:uploads/captured-images}

  keycloak:

    admin:
      base-url: ${FIELDSYNC_KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
      realm: ${FIELDSYNC_KEYCLOAK_ADMIN_REALM:fieldsync}
      client-id: ${FIELDSYNC_KEYCLOAK_ADMIN_CLIENT_ID:fieldsync-backend-admin}
      create-temporary-password: ${FIELDSYNC_KEYCLOAK_CREATE_TEMP_PASSWORD:true}
      