spring:

  datasource:
    url: jdbc:postgresql://localhost:5434/${FIELDSYNC_DB_NAME:fieldsync_dev}
    username: ${FIELDSYNC_DB_USER:fieldsync_app}
    password: ${FIELDSYNC_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/fieldsync}

server:
  port: 8081